name: imsakiye daily content

# Renders the day's stories, post and reels for @imsakiye.social into imsakiye/ (served by GitHub Pages).
# Supabase publishes them to Instagram and Facebook at the scheduled times.
on:
  schedule:
    - cron: "30 0 * * *"      # 03:30 Istanbul: today's content
  push:
    branches: [main]
    paths: ["_imsakiye_pipeline/**", ".github/workflows/imsakiye-daily.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imsakiye-daily
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.47.0 pillow==10.4.0 numpy==2.1.1
          python -m playwright install --with-deps chromium
          cd _imsakiye_pipeline && npm install --no-audit --no-fund
      - name: Render
        run: |
          python _imsakiye_pipeline/daily.py "$(TZ=Europe/Istanbul date +%F)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            python _imsakiye_pipeline/daily.py "$(TZ=Europe/Istanbul date -d tomorrow +%F)"
          fi
      - name: Publish files to the site
        run: |
          git config user.name "imsakiye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imsakiye
          git diff --cached --quiet && exit 0
          git commit -m "imsakiye: daily content $(TZ=Europe/Istanbul date +%F)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
