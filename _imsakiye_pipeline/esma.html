<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:"Inter"; font-weight:100 900; src:url("node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2") format("woff2"); unicode-range:U+0100-024F; }
@font-face { font-family:"Inter"; font-weight:100 900; src:url("node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family:"Fraunces"; font-weight:600; src:url("node_modules/@fontsource/fraunces/files/fraunces-latin-ext-600-normal.woff2") format("woff2"); unicode-range:U+0100-024F; }
@font-face { font-family:"Fraunces"; font-weight:600; src:url("node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family:"NaskhAr"; font-weight:700; src:url("node_modules/@fontsource/noto-naskh-arabic/files/noto-naskh-arabic-arabic-700-normal.woff2") format("woff2"); }
:root { --mint:#86efac; --cream:#f3f6f2; --gold:#e7c27c; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; background:#0b1c15; }
body { font-family:"Inter",sans-serif; color:var(--cream); }
#bg { position:absolute; inset:0; background:
  radial-gradient(900px 900px at 50% 42%, #2f6d55 0%, rgba(47,109,85,0) 70%),
  linear-gradient(180deg,#1c4636 0%,#0b1c15 100%); }
#pat { position:absolute; inset:-300px; opacity:.05; }
#star { position:absolute; left:140px; top:440px; width:800px; height:800px; opacity:.0; }
.c { position:absolute; left:0; right:0; text-align:center; }
#kick { top:300px; font-size:30px; font-weight:700; letter-spacing:8px; color:var(--mint); }
#num { top:350px; font-family:"Fraunces",serif; font-weight:600; font-size:44px; color:rgba(243,246,242,.65); }
#ar { top:620px; font-family:"NaskhAr",serif; font-weight:700; font-size:200px; line-height:1.5; color:#fff; direction:rtl;
      text-shadow:0 0 60px rgba(134,239,172,.35), 0 10px 40px rgba(0,0,0,.4); }
#tr { top:1060px; font-family:"Fraunces",serif; font-weight:600; font-size:110px; }
#line { top:1215px; font-size:36px; color:rgba(243,246,242,.72); }
#rule { position:absolute; left:440px; width:200px; height:4px; top:1190px; background:var(--gold); border-radius:2px; transform-origin:50% 50%; }
#cta { position:absolute; left:50%; top:1340px; transform:translateX(-50%); display:flex; align-items:center; gap:22px;
       background:rgba(134,239,172,.12); border:2px solid rgba(134,239,172,.35); padding:20px 34px 20px 20px; border-radius:999px; white-space:nowrap; }
#cta img { width:72px; height:72px; border-radius:18px; }
#cta .t1 { font-size:30px; font-weight:800; }
#cta .t2 { font-size:24px; color:rgba(243,246,242,.7); margin-top:2px; }
#flash { position:absolute; inset:0; background:#eafff1; opacity:0; }
</style>
</head>
<body>
<div id="bg"></div>
<svg id="pat" width="1680" height="2520" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="p" width="168" height="168" patternUnits="userSpaceOnUse"><g fill="none" stroke="#fff" stroke-width="2"><rect x="42" y="42" width="84" height="84"/><rect x="42" y="42" width="84" height="84" transform="rotate(45 84 84)"/><circle cx="84" cy="84" r="16"/></g></pattern></defs><rect width="1680" height="2520" fill="url(#p)"/></svg>
<svg id="star" viewBox="0 0 200 200"><g fill="none" stroke="#86efac" stroke-width="1.2"><rect x="40" y="40" width="120" height="120"/><rect x="40" y="40" width="120" height="120" transform="rotate(45 100 100)"/><circle cx="100" cy="100" r="58"/><circle cx="100" cy="100" r="90" stroke-dasharray="2 6"/></g></svg>
<div id="kick" class="c">ESMÂ-ÜL HÜSNÂ</div>
<div id="num" class="c"></div>
<div id="ar" class="c"></div>
<div id="rule"></div>
<div id="tr" class="c"></div>
<div id="line" class="c">Allah'ın güzel isimlerinden</div>
<div id="cta"><img src="icon.png"><div><div class="t1">99 ismin tamamı İmsakiye'de</div><div class="t2">Her gün bir isim · takipte kal</div></div></div>
<div id="flash"></div>
<script>
const D = window.__DATA__;  // {number, arabic, transliteration}
document.getElementById("num").textContent = `${D.number} / 99`;
document.getElementById("ar").textContent = D.arabic;
document.getElementById("tr").textContent = D.transliteration;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
window.DURATION = 12;
window.render = function(t){
  $("pat").style.transform=`translate(${-t*8}px,${-t*12}px)`;
  const k1=eo((t-0.2)/0.6); $("kick").style.opacity=k1; $("kick").style.letterSpacing=`${8+(1-k1)*14}px`;
  const k2=eo((t-0.45)/0.6); $("num").style.opacity=k2; $("num").style.transform=`translateY(${(1-k2)*20}px)`;
  const ks=eo((t-0.6)/1.6); $("star").style.opacity=0.55*ks; $("star").style.transform=`rotate(${t*6}deg) scale(${0.8+0.2*ks})`;
  const k3=eo((t-0.9)/1.4); $("ar").style.opacity=k3; $("ar").style.filter=`blur(${(1-k3)*18}px)`; $("ar").style.transform=`scale(${1.12-0.12*k3})`;
  const kr=eo((t-2.3)/0.6); $("rule").style.transform=`scaleX(${kr})`;
  const k4=eo((t-2.5)/0.7); $("tr").style.opacity=k4; $("tr").style.transform=`translateY(${(1-k4)*40}px)`; $("tr").style.letterSpacing=`${(1-k4)*14}px`;
  const k5=eo((t-3.3)/0.6); $("line").style.opacity=k5;
  const k6=back((t-6.8)/0.6); $("cta").style.opacity=clamp((t-6.8)/0.2); $("cta").style.transform=`translateX(-50%) scale(${0.6+0.4*k6})`;
  $("flash").style.opacity = t>0.9&&t<1.15 ? (1-(t-0.9)/0.25)*0.15 : 0;
  document.body.style.filter=`brightness(${clamp(t/0.4)*(1-clamp((t-11.4)/0.6))})`;
};
render(0);
</script>
</body>
</html>
